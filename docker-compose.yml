services:
  notebook:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - IJAVA_CLASSPATH=/home/jovyan/work/pg/pg-api/build/libs/*:/home/jovyan/work/pg/pg-global/build/libs/*:/home/jovyan/work/pg/pg-multiverse/build/libs/*:/home/jovyan/work/pg/pg-io/build/libs/*:/home/jovyan/work/pgv/examples/pgv-exporter/target/*:/home/jovyan/work/pgv-display/build/libs/*
    ports:
      - "8888:8888"
    volumes:
      # Mount the root directory to /home/jovyan/work so the container can build pg and pgv submodules
      - .:/home/jovyan/work
      # Explicit mounts for data and notebooks (ensure they persist in local folders)
      - ./data:/home/jovyan/work/data
      - ./notebooks:/home/jovyan/work/notebooks
    working_dir: /home/jovyan/work
    command: bash -c "./postBuild && jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --NotebookApp.token=''"
